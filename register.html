<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل حساب جديد | منصة القدرات بذكاء مع أحمد عنتر</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:8px">
        <a href="index.html" style="text-decoration:none;color:inherit;font-weight:800;font-size:1.2rem">
          🧠 القدرات بذكاء
        </a>
      </div>
      <h1>إنشاء حساب جديد</h1>
      <p class="subtitle">ابدأ رحلتك نحو الـ ١٠٠ مع أحمد عنتر</p>

      <div id="error" class="error-msg"></div>
      <div id="success" class="success-msg"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">الاسم الكامل</label>
          <input type="text" id="name" placeholder="مثال: أحمد محمد" required>
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="٤ أحرف على الأقل" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">تسجيل وإنشاء حساب</button>
      </form>

      <p class="auth-footer">
        لديك حساب؟ <a href="login.html">تسجيل الدخول</a>
      </p>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>redirectIfLoggedIn();</script>
</body>
</html>
