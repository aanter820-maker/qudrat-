<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار | منصة القدرات بذكاء مع أحمد عنتر</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="quiz-page">
    <header class="quiz-header">
      <div class="container">
        <a href="dashboard.html" style="text-decoration:none;color:var(--text-muted);font-weight:600">← رجوع</a>
        <div class="quiz-progress">
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
        <div>
          <span id="quizTitle" style="font-weight:700;margin-left:12px">الاختبار</span>
          <span class="quiz-timer" id="quizTimer">١٢:٠٠</span>
        </div>
      </div>
    </header>

    <div class="container">
      <div id="quizBody" class="quiz-body">
        <div class="question-card">
          <p class="q-counter" id="qCounter">سؤال 1 من 10</p>
          <p class="question-text" id="questionText">جاري التحميل...</p>
          <div class="quiz-options" id="quizOptions"></div>
          <div class="explanation" id="explanation"></div>
          <div class="quiz-actions">
            <button class="btn btn-primary" id="checkBtn" onclick="Quiz.check()">تحقق من الإجابة</button>
            <button class="btn btn-primary" id="nextBtn" style="display:none" onclick="Quiz.next()">السؤال التالي ←</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script src="js/app.js"></script>
  <script>startQuizFromPage();</script>
</body>
</html>
